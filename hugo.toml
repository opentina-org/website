baseURL = "https://opentina.org/"
languageCode = "en-us"
title = "OpenTina"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10000
taxonomies = {}
summaryLength = 30
timeZone = "UTC"

[params]
  description = "OpenTina is an open-source community providing low-level system software and multi-OS distribution support for the Allwinner A733 chip platform."
  github = "https://github.com/opentina-org"
  defaultTheme = "auto" # auto | light | dark

# Default language: English, clean URLs like /docs/, /community/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages.en]
  languageName = "English"
  languageCode = "en"
  contentDir = "content/en"
  title = "OpenTina"
  weight = 1
  [languages.en.params]
    description = "OpenTina is an open-source community providing low-level system software and multi-OS distribution support for the Allwinner A733 chip platform."
